<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kotaro Workout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>my PPL</h1>
    <p>今日も1%強くなる。</p>
  </header>

  <main>

    <section class="workout-timer-card">

      <h2>Workout Timer</h2>
    
      <div id="workoutTimerDisplay" class="workout-timer-display">
        00:00:00
      </div>

      <div class="workout-type-select">

        <label for="workoutType">Workout Type</label>
      
        <select id="workoutType">
          <option value="">Select</option>
          <option value="Push">Push</option>
          <option value="Pull">Pull</option>
          <option value="Legs">Legs</option>
        </select>
      
      </div>
    
      <div class="workout-timer-controls">
    
       
        
        <button id="startWorkoutBtn">
          Start Workout
        </button>
    
       
        
        <button id="finishWorkoutBtn">
          Finish Workout
        </button>
    
      </div>
    
    </section>

    <section class="session-history-card">

      <h2>Workout Sessions</h2>
    
      <div id="sessionHistoryList">
        No workout sessions yet.
      </div>
    
    </section>
    
    <section class="weight-card">
      <h2>Current Weight</h2>
    
      <div class="weight-display">
        <span id="currentWeight">67</span>
        <span>kg</span>
      </div>
    
      <div class="weight-input-area">
        <input
          id="bodyWeightInput"
          type="number"
          step="0.1"
          placeholder="67.0"
        >
    
        <button id="saveWeightBtn">
          Record Weight
        </button>
      </div>
    </section>

    <section class="weight-chart-card">

      <h2>Body Weight Progress</h2>
    
      <div class="chart-container">
        <canvas id="weightChart"></canvas>
      </div>
    
    </section> 

    <section class="exercise-chart-card">

      <h2>Strength Progress</h2>
    
      <select id="exerciseChartSelect"></select>
    
      <div class="chart-container">
        <canvas id="exerciseChart"></canvas>
      </div>
    
    </section>

    <section id="workoutSection" class="workout-section"></section>

    <section class="history-section">
        <h2>Workout History</h2>
      
        <div id="historyList">
        </div>
      </section>    

  </main>

  <div id="workoutModal" class="modal">

    <div class="modal-content">
  
      <button id="closeModal" class="close-btn">×</button>
  
      <h2 id="modalExerciseName">Exercise</h2>
  
      <div class="sets-header">
        <span>Set</span>
        <span>Weight</span>
        <span>Reps</span>
      </div>
  
      <div id="setsContainer"></div>
  
      <button id="addSetBtn" class="add-set-btn">
        ＋ Add Set
      </button>
  
      <div class="rest-timer">

        <h3>Rest Timer</h3>
      
        <div class="timer-display" id="restTimerDisplay">
          01:30
        </div>
      
        <div class="timer-controls">
          <input
            id="restTimeInput"
            type="number"
            min="10"
            step="10"
            value="90"
          >
          <span>sec</span>
      
          <button id="startRestBtn">
            Start
          </button>
      
          <button id="resetRestBtn">
            Reset
          </button>
        </div>
      
      </div>
      
      <label class="next-default-option">
        <input
          id="useAsNextDefault"
          type="checkbox"
          checked
        >
        この記録を次回の初期値にする
      </label>
      
      <button id="saveWorkoutBtn" class="save-btn">
        Save Workout
      </button>
  
    </div>
  
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
