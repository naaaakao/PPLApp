<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kotaro Workout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>my PPL</h1>
    <p>今日も1%強くなる。</p>
  </header>

  <main>

    <section id="workoutPage" class="app-page active" data-page="workout">

      <section id="activeWorkoutStatus" class="active-workout-card" hidden>
        <div class="active-workout-label">ACTIVE WORKOUT</div>
        <h2 id="activeWorkoutTitle">PUSH WORKOUT</h2>
        <div id="workoutTimerDisplay" class="workout-timer-display">00:00:00</div>
        <div id="activeWorkoutExerciseCount" class="active-workout-progress">0 / 6 exercises</div>
        <button id="finishWorkoutBtn" class="finish-workout-btn">Finish Workout</button>
      </section>

      <section id="workoutStartCard" class="workout-start-card">
        <p class="workout-start-label">START A WORKOUT</p>
        <h2>What are you training today?</h2>
        <div class="workout-type-buttons" role="group" aria-label="Workout Type">
          <button class="workout-type-button" type="button" data-workout-type="Push">Push</button>
          <button class="workout-type-button" type="button" data-workout-type="Pull">Pull</button>
          <button class="workout-type-button" type="button" data-workout-type="Legs">Legs</button>
        </div>
        <select id="workoutType" hidden aria-label="Selected Workout Type">
          <option value="">Select</option>
          <option value="Push">Push</option>
          <option value="Pull">Pull</option>
          <option value="Legs">Legs</option>
        </select>
        <button id="startWorkoutBtn" class="start-workout-btn">Start Workout</button>
      </section>

      <section id="workoutSection" class="workout-section"></section>

    </section>

    <section id="historyPage" class="app-page" data-page="history">
      <section class="session-history-card">
        <h2>Workout Sessions</h2>
        <div id="sessionHistoryList">No workout sessions yet.</div>
      </section>
    </section>

    <section id="progressPage" class="app-page" data-page="progress">
      <section class="weight-card">
        <h2>Current Weight</h2>
        <div class="weight-display">
          <span id="currentWeight">67</span>
          <span>kg</span>
        </div>
        <div class="weight-input-area">
          <input id="bodyWeightInput" type="number" step="0.1" placeholder="67.0">
          <button id="saveWeightBtn">Record Weight</button>
        </div>
      </section>

      <section class="weight-chart-card">
        <h2>Body Weight Progress</h2>
        <div class="chart-container">
          <canvas id="weightChart"></canvas>
        </div>
      </section>

      <section class="exercise-chart-card">
        <h2>Strength Progress</h2>
        <select id="exerciseChartSelect"></select>
        <div class="chart-container">
          <canvas id="exerciseChart"></canvas>
        </div>
      </section>
    </section>

  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-button active" type="button" data-page-target="workout">Workout</button>
    <button class="nav-button" type="button" data-page-target="history">History</button>
    <button class="nav-button" type="button" data-page-target="progress">Progress</button>
  </nav>

  <div id="workoutModal" class="modal">

    <div class="modal-content">
  
      <button id="closeModal" class="close-btn">×</button>
  
      <h2 id="modalExerciseName">Exercise</h2>
  
      <div class="sets-header">
        <span>Set</span>
        <span>Weight</span>
        <span>Reps</span>
        <span aria-hidden="true"></span>
      </div>
  
      <div id="setsContainer"></div>
  
      <button id="addSetBtn" class="add-set-btn">
        ＋ Add Set
      </button>
  
      <div class="rest-timer">

        <h3>Rest Timer</h3>
      
        <div class="timer-display" id="restTimerDisplay">
          01:30
        </div>
      
        <div class="rest-time-setting">
          <label for="restTimeInput">Rest Time</label>
          <div>
            <input id="restTimeInput" type="number" min="10" step="10" value="90">
            <span>sec</span>
          </div>
        </div>

        <div class="timer-controls">
          <button id="startRestBtn">Start</button>
          <button id="resetRestBtn">Reset</button>
        </div>
      
      </div>
      
      <label class="next-default-option">
        <input
          id="useAsNextDefault"
          type="checkbox"
          checked
        >
        この記録を次回の初期値にする
      </label>
      
      <button id="saveWorkoutBtn" class="save-btn">
        Save Exercise
      </button>
  
    </div>
  
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
